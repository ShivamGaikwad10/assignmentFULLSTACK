<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Attendance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171c;
    --ink-soft:#1b2027;
    --paper:#f6f1e7;
    --paper-2:#ece4d2;
    --ink-text:#1b1b1f;
    --muted-ink:#8b93a1;
    --muted-paper:#8a8170;
    --line:rgba(27,27,31,0.22);
    --green:#178a55;
    --green-bright:#3ddb96;
    --amber:#8a5a14;
    --amber-bright:#d99a3d;
    --radius:14px;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background-color:var(--ink);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(61,219,150,0.08), transparent 55%),
      radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.4px);
    background-size:auto, 24px 24px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .terminal{
    width:100%;
    max-width:760px;
  }

  .lead{
    text-align:center;
    max-width:520px;
    margin:0 auto 36px;
    animation:rise .6s ease both;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--green-bright);
    margin:0 0 14px;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:clamp(26px, 4.4vw, 38px);
    line-height:1.15;
    margin:0 0 12px;
    color:#fbf9f4;
  }

  .sub{
    margin:0;
    font-size:15px;
    line-height:1.55;
    color:var(--muted-ink);
  }

  .ticket{
    display:flex;
    align-items:stretch;
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:0 30px 60px -25px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.05);
    overflow:visible;
    animation:rise .65s .08s ease both;
  }

  .stub{
    padding:32px;
  }

  .stub-main{
    flex:1 1 64%;
    border-top-left-radius:var(--radius);
    border-bottom-left-radius:var(--radius);
  }

  .stub-side{
    flex:1 1 36%;
    background:var(--paper-2);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    border-top-right-radius:var(--radius);
    border-bottom-right-radius:var(--radius);
  }

  .perforation{
    flex:0 0 auto;
    width:0;
    border-left:2px dashed var(--line);
    position:relative;
  }
  .perforation::before,
  .perforation::after{
    content:"";
    position:absolute;
    left:50%;
    width:22px;
    height:22px;
    background:var(--ink);
    border-radius:50%;
    transform:translateX(-50%);
  }
  .perforation::before{ top:-11px; }
  .perforation::after{ bottom:-11px; }

  .field-label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted-paper);
    margin:0 0 12px;
  }
  .field-label .req{ color:var(--amber); }

  .dropzone{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:6px;
    min-height:190px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(27,27,31,0.03);
    cursor:pointer;
    overflow:hidden;
    transition:border-color .2s ease, background-color .2s ease;
  }
  .dropzone:hover{ background:rgba(23,138,85,0.06); }
  .dropzone:focus-within{
    outline:none;
    box-shadow:0 0 0 3px rgba(61,219,150,0.45);
  }
  .dropzone.is-dragover{
    background:rgba(23,138,85,0.1);
    border-color:var(--green);
  }

  .dropzone input[type="file"]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    margin:0;
    cursor:pointer;
  }

  .brackets i{
    position:absolute;
    width:18px;
    height:18px;
    border-color:var(--muted-paper);
    transition:border-color .2s ease;
  }
  .brackets i:nth-child(1){ top:10px; left:10px; border-top:3px solid; border-left:3px solid; border-radius:4px 0 0 0; }
  .brackets i:nth-child(2){ top:10px; right:10px; border-top:3px solid; border-right:3px solid; border-radius:0 4px 0 0; }
  .brackets i:nth-child(3){ bottom:10px; left:10px; border-bottom:3px solid; border-left:3px solid; border-radius:0 0 0 4px; }
  .brackets i:nth-child(4){ bottom:10px; right:10px; border-bottom:3px solid; border-right:3px solid; border-radius:0 0 4px 0; }
  .dropzone.is-dragover .brackets i,
  .dropzone.has-file .brackets i{ border-color:var(--green); }

  .scanline{
    position:absolute;
    left:20px;
    right:20px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--green-bright), transparent);
    top:16px;
    animation:scan 2.6s ease-in-out infinite;
    opacity:.8;
  }
  .dropzone.has-file .scanline{ display:none; }

  .dz-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    color:var(--muted-paper);
    pointer-events:none;
  }
  .dz-icon{ width:38px; height:38px; color:var(--muted-paper); }
  .dz-text{ font-size:14px; color:var(--ink-text); }
  .dz-text u{ color:var(--green); text-decoration-color:var(--green); text-underline-offset:2px; }
  .dz-hint{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.04em; }

  .preview-wrap{
    position:absolute;
    inset:0;
    display:none;
  }
  .dropzone.has-file .preview-wrap{ display:block; }
  .dropzone.has-file .dz-content{ display:none; }
  .preview-img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .preview-caption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:6px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:#fbf9f4;
    background:linear-gradient(0deg, rgba(20,23,28,0.78), transparent);
    pointer-events:none;
  }

  .filename{
    min-height:18px;
    margin:10px 2px 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--green);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .submit-btn{
    width:100%;
    margin-top:18px;
    padding:14px 18px;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:#fbf9f4;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.01em;
    cursor:pointer;
    transition:background-color .15s ease, transform .15s ease;
  }
  .submit-btn:hover{ background-color:#147b4b; }
  .submit-btn:active{ transform:translateY(1px); }
  .submit-btn:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(61,219,150,0.5);
  }
  .submit-btn:disabled{ opacity:.7; cursor:progress; }

  .stub-side .field-label{ margin-bottom:18px; }
  .ledger-icon{ width:28px; height:28px; color:var(--amber-bright); margin-bottom:14px; }

  .report-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--amber);
    text-decoration:none;
    font-weight:600;
    font-size:14.5px;
    line-height:1.4;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .report-link svg{ width:15px; height:15px; transition:transform .15s ease; }
  .report-link:hover{ border-color:currentColor; }
  .report-link:hover svg{ transform:translateX(2px); }
  .report-link:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(138,90,20,0.35);
    border-radius:4px;
  }

  .serial{
    margin-top:auto;
    padding-top:24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--muted-paper);
  }

  .micro{
    text-align:center;
    margin-top:22px;
  }
  .micro p{
    margin:0;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:.06em;
    color:var(--muted-ink);
  }

  @keyframes scan{
    0%{ transform:translateY(0); opacity:.2; }
    50%{ opacity:.9; }
    100%{ transform:translateY(150px); opacity:.2; }
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width:640px){
    .ticket{ flex-direction:column; }
    .stub-main{ border-radius:var(--radius) var(--radius) 0 0; }
    .stub-side{ border-radius:0 0 var(--radius) var(--radius); }
    .perforation{
      width:auto; height:0;
      border-left:none;
      border-top:2px dashed var(--line);
    }
    .perforation::before, .perforation::after{ top:50%; left:auto; transform:translateY(-50%); }
    .perforation::before{ left:-11px; }
    .perforation::after{ left:auto; right:-11px; bottom:auto; }
    .serial{ padding-top:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .scanline{ animation:none; opacity:.5; }
    .lead, .ticket{ animation:none; }
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <div class="terminal">

    <header class="lead">
      <p class="eyebrow">Attendance Terminal</p>
      <h1>Scan in, you're marked present.</h1>
      <p class="sub">Upload the QR code from your session pass to log today's attendance.</p>
    </header>

    <main class="ticket">

      <div class="stub stub-main">
        <form action="/upload" method="post" enctype="multipart/form-data" id="attendanceForm">

          <span class="field-label">Upload QR code <span class="req">*</span></span>

          <label for="qrImage" class="dropzone" id="dropzone">
            <span class="brackets" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="scanline" aria-hidden="true"></span>

            <span class="dz-content">
              <svg class="dz-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="6" y="6" width="13" height="13" rx="2"/>
                <rect x="29" y="6" width="13" height="13" rx="2"/>
                <rect x="6" y="29" width="13" height="13" rx="2"/>
                <rect x="29" y="29" width="4" height="4" rx="1" fill="currentColor" stroke="none"/>
                <rect x="37" y="29" width="4" height="4" rx="1" fill="currentColor" stroke="none"/>
                <rect x="29" y="37" width="4" height="4" rx="1" fill="currentColor" stroke="none"/>
              </svg>
              <span class="dz-text">Drop image here, or <u>browse</u></span>
              <span class="dz-hint">JPG, PNG, or HEIC</span>
            </span>

            <span class="preview-wrap">
              <img id="previewImg" class="preview-img" alt="Selected QR code preview">
              <span class="preview-caption">Click to replace</span>
            </span>

            <input type="file" id="qrImage" name="qrImage" accept="image/*" required>
          </label>

          <p class="filename" id="filenameDisplay" aria-live="polite"></p>

          <button type="submit" class="submit-btn" id="submitBtn">
            <span id="submitLabel">Mark Attendance</span>
          </button>
        </form>
      </div>

      <div class="perforation" aria-hidden="true"></div>

      <aside class="stub stub-side">
        <span class="field-label">Records</span>
        <svg class="ledger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
          <path d="M14 3v5h5"/>
          <path d="M8 13h8M8 16.5h8M8 9.5h3"/>
        </svg>
        <a href="/report" class="report-link">
          View Attendance Report
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
        <p class="serial" id="serial"></p>
      </aside>

    </main>

    <footer class="micro">
      <p id="issuedLine"></p>
    </footer>

  </div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('qrImage');
  const filenameDisplay = document.getElementById('filenameDisplay');
  const previewImg = document.getElementById('previewImg');
  const form = document.getElementById('attendanceForm');
  const submitBtn = document.getElementById('submitBtn');
  const submitLabel = document.getElementById('submitLabel');

  function updateFileDisplay(){
    const file = fileInput.files && fileInput.files[0];
    if(!file){
      dropzone.classList.remove('has-file');
      filenameDisplay.textContent = '';
      return;
    }
    dropzone.classList.add('has-file');
    filenameDisplay.textContent = file.name;
    const reader = new FileReader();
    reader.onload = e => { previewImg.src = e.target.result; };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener('change', updateFileDisplay);

  ['dragenter','dragover'].forEach(evt =>
    dropzone.addEventListener(evt, e => {
      e.preventDefault();
      dropzone.classList.add('is-dragover');
    })
  );
  ['dragleave','dragend'].forEach(evt =>
    dropzone.addEventListener(evt, () => dropzone.classList.remove('is-dragover'))
  );
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('is-dragover');
    const dt = e.dataTransfer;
    if(dt && dt.files && dt.files.length){
      fileInput.files = dt.files;
      updateFileDisplay();
    }
  });

  form.addEventListener('submit', () => {
    submitBtn.disabled = true;
    submitLabel.textContent = 'Marking attendance…';
  });

  document.getElementById('serial').textContent =
    'NO. ' + String(Math.floor(Math.random() * 9000) + 1000);

  const now = new Date();
  document.getElementById('issuedLine').textContent =
    'TERMINAL ONLINE · ' +
    now.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' }) +
    ' · ' +
    now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
</script>

</body>
</html>
